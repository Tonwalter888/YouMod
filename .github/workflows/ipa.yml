name: Build IPA with tweaks
on:
  workflow_dispatch:
    inputs:
      repo:
        description: 'Repository to build from'
        required: true
        default: 'Tonwalter888/YouMod'

      branch:
        description: 'Branch to build from'
        required: true
        default: 'main'

      ipa_url:
        description: "URL to the decrypted IPA file"
        default: ""
        required: true
        type: string

      display_name:
        description: "App Name (Optional)"
        default: "YouTube"
        required: true
        type: string

      bundle_id:
        description: "Bundle ID (Optional)"
        default: "com.google.ios.youtube"
        required: true
        type: string

      youpip:
        description: "Integrate YouPiP"
        default: true
        required: false
        type: boolean

      ytuhd:
        description: "Integrate YTUHD"
        default: true
        required: false
        type: boolean

      ryd:
        description: "Integrate Return-YouTube-Dislikes"
        default: true
        required: false
        type: boolean

      abconfig:
        description: "Integrate YTABConfig"
        default: true
        required: false
        type: boolean

      youquality:
        description: "Integrate YouQuality"
        default: false
        required: false
        type: boolean

      demc:
        description: "Integrate DontEatMyContent"
        default: true
        required: false
        type: boolean

      ytweaks:
        description: "Integrate YTweaks"
        default: true
        required: false
        type: boolean

      youslider:
        description: "Integrate YouSlider"
        default: true
        required: false
        type: boolean

      gonerino:
        description: "Integrate Gonerino"
        default: true
        required: false
        type: boolean

      ytshare:
        description: "Integrate youtube-native-share"
        default: true
        required: false
        type: boolean

      volboost:
        description: "Integrate VolumeBoostYT (Require iOS 16+)"
        default: true
        required: false
        type: boolean

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build IPA with tweaks
    runs-on: macos-latest
    permissions:
      contents: write

    steps:
      - name: Hide Sensitive Inputs
        uses: levibostian/action-hide-sensitive-inputs@v1
        with:
          exclude_inputs: bundle_id,display_name,youpip,ytuhd,ryd,abconfig,ytweaks,youslider,gonerino,demc,volboost,repo,branch,youquality,ytshare
          
      - name: Install MEGA downloader
        if: ${{ startsWith(inputs.ipa_url, 'https://mega.nz/') }}
        run: brew install megatools

      - name: Download IPA from Mega share link
        if: ${{ startsWith(inputs.ipa_url, 'https://mega.nz/') }}
        env:
          IPA_URL: ${{ inputs.ipa_url }}
        run: |
          megadl --no-progress --path youtube.ipa "$IPA_URL"

      - name: Download IPA from direct URL
        if: ${{ !startsWith(inputs.ipa_url, 'https://mega.nz/') }}
        env:
          IPA_URL: ${{ inputs.ipa_url }}
        run: |
          wget "$IPA_URL" --quiet --no-verbose -O youtube.ipa

      - name: Validate IPA
        run: |
          file_type=$(file --mime-type -b youtube.ipa)

          if [[ "$file_type" != "application/x-ios-app" && "$file_type" != "application/zip" ]]; then
            echo "::error::Validation failed: The downloaded file is not a valid IPA. Detected type: $file_type."
            exit 1
          fi

      - name: Get YouTube Version 
        run: |
          unzip -q youtube.ipa -d ytextracted
          echo "YT_VERSION=$(grep -A 1 '<key>CFBundleVersion</key>' ytextracted/Payload/YouTube.app/Info.plist | grep '<string>' | awk -F'[><]' '{print $3}')" >> $GITHUB_ENV

      - name: Install Dependencies
        run: brew install make ldid gnu-sed autoconf automake libtool pkg-config

      - name: Install Go
        if: ${{ inputs.gonerino }}
        run: brew install go

      - name: Set PATH Environment Variables
        run: |
          echo "$(brew --prefix make)/libexec/gnubin" >> $GITHUB_PATH
          echo "THEOS=${{ github.workspace }}/theos" >> $GITHUB_ENV

      # Original from YTweaks
      - name: Get tweaks commit
        run: |
          get_commit_hash() {
            local repo_url=$1
            git ls-remote "$repo_url" HEAD | awk '{print substr($1,1,7)}'
          }
          echo "THEOS_COMMIT=$(get_commit_hash "https://github.com/roothide/theos")" >> $GITHUB_ENV

      - name: Cache Theos
        id: cache-theos
        uses: actions/cache@v6
        with:
          path: theos
          key: 26.5-SDK-${{ env.THEOS_COMMIT }}

      - name: Setup Theos
        if: ${{ steps.cache-theos.outputs.cache-hit != 'true' }}
        run: |
            git clone --quiet --depth=1 --recurse-submodules https://github.com/roothide/theos.git
            git clone --quiet --depth=1 -n --filter=tree:0 https://github.com/Tonwalter888/iOS-SDKs.git
            cd iOS-SDKs
            git sparse-checkout set --no-cone iPhoneOS26.5.sdk
            git checkout --quiet
            mv *.sdk "$THEOS/sdks"
            cd ${{ github.workspace }}/theos/vendor/logos
            git checkout a623700
            
      - name: Clone headers
        run: |
          if [ ! -d "$THEOS/include/YouTubeHeader" ]; then
            git clone --quiet --depth=1 https://github.com/PoomSmart/YouTubeHeader.git "$THEOS/include/YouTubeHeader"
          else
            cd $THEOS/include/YouTubeHeader
            git pull --quiet --force
            cd ${{ github.workspace }}
          fi
          
          if [ "${{ inputs.demc }}" = "true" ]; then
            rm -fr "$THEOS/include/YTHeaders"
            cp -r "$THEOS/include/YouTubeHeader" "$THEOS/include/YTHeaders"
          fi
          
          if [ ! -d "$THEOS/include/PSHeader" ]; then
            git clone --quiet --depth=1 https://github.com/PoomSmart/PSHeader.git "$THEOS/include/PSHeader"
          else
            cd $THEOS/include/PSHeader
            git pull --quiet --force
            cd ${{ github.workspace }}
          fi

      - name: Fix Theos od broken pipe issue
        run: sed -i '' 's/od -c "$i" | head/od -c "$i" 2>\/dev\/null | head/g' $THEOS/bin/convert_xml_plist.sh || true

      - name: Install cyan
        run: pipx install https://github.com/asdfzxcvbn/pyzule-rw/archive/main.zip

      - name: Checkout YouMod
        uses: actions/checkout@v7
        with:
          repository: ${{ inputs.repo }}
          ref: ${{ inputs.branch }}
          path: YouMod

      - name: Clone Open in YouTube (Safari Extension)
        run: |
          git clone --quiet -n --depth=1 --filter=tree:0 https://github.com/BillyCurtis/OpenYouTubeSafariExtension.git
          cd OpenYouTubeSafariExtension
          git sparse-checkout set --no-cone OpenYouTubeSafariExtension.appex
          git checkout --quiet
          mv *.appex ${{ github.workspace }}

      - name: Clone YouPiP
        if: ${{ inputs.youpip }}
        run: git clone --quiet --depth=1 https://github.com/PoomSmart/YouPiP.git
    
      - name: Clone YTUHD
        if: ${{ inputs.ytuhd }}
        run: git clone --quiet --depth=1 --recurse-submodules https://github.com/PoomSmart/YTUHD.git
           
      - name: Clone Return-YouTube-Dislikes
        if: ${{ inputs.ryd }}
        run: git clone --quiet --depth=1 https://github.com/PoomSmart/Return-YouTube-Dislikes.git

      - name: Clone YouGroupSettings
        run: git clone --quiet --depth=1 https://github.com/PoomSmart/YouGroupSettings.git
           
      - name: Clone YTVideoOverlay
        if: ${{ inputs.youpip || inputs.ytuhd || inputs.youquality }}
        run: git clone --quiet --depth=1 https://github.com/PoomSmart/YTVideoOverlay.git
          
      - name: Clone YTABConfig
        if: ${{ inputs.abconfig }}
        run: git clone --quiet --depth=1 https://github.com/PoomSmart/YTABConfig.git

      - name: Clone UncappedAVPlayer
        run: git clone --quiet --depth=1 https://github.com/PoomSmart/UncappedAVPlayer.git

      - name: Clone DontEatMyContent
        if: ${{ inputs.demc }}
        run: git clone --quiet --depth=1 https://github.com/therealFoxster/DontEatMyContent.git

      - name: Clone YouSlider
        if: ${{ inputs.youslider }}
        run: |
          git clone --quiet --depth=1 https://github.com/PoomSmart/YouSlider.git
          wget --no-verbose --quiet https://github.com/Tonwalter888/Tonwalter888.github.io/raw/refs/heads/main/debs/alderis.deb

      - name: Clone YTweaks
        if: ${{ inputs.ytweaks }}
        run: git clone --quiet --depth=1 https://github.com/fosterbarnes/YTweaks.git

      - name: Clone Gonerino
        if: ${{ inputs.gonerino }}
        run: git clone --quiet --depth=1 https://github.com/castdrian/Gonerino.git

      - name: Clone youtube-native-share
        if: ${{ inputs.ytshare }}
        run: git clone --quiet --depth=1 https://github.com/jkhsjdhjs/youtube-native-share.git

      - name: Clone VolumeBoostYT
        if: ${{ inputs.volboost }}
        run: git clone --quiet --depth=1 https://github.com/VasirakCalgux/VolumeBoostYT.git

      - name: Clone YouQuality
        if: ${{ inputs.youquality }}
        run: git clone --quiet --depth=1 https://github.com/PoomSmart/YouQuality.git

      - name: Build YouMod
        run: |
          cd YouMod
          echo "YOUMOD_VERSION=$(grep '^Version:' control | cut -d ' ' -f2)" >> $GITHUB_ENV
          make clean package DEBUG=0 FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless
          mv packages/*.deb ${{ github.workspace }}/youmod.deb

      - name: Build YouPiP
        if: ${{ inputs.youpip }}
        run: |
          cd YouPiP
          make clean package DEBUG=0 FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless
          mv packages/*.deb ${{ github.workspace }}/youpip.deb

      - name: Build YTUHD
        if: ${{ inputs.ytuhd }}
        run: |
          cd YTUHD
          brew install meson ninja
          make libvpx dav1d
          make clean package DEBUG=0 FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless SIDELOAD=1
          mv packages/*.deb ${{ github.workspace }}/ytuhd.deb

      - name: Build Return-YouTube-Dislikes
        if: ${{ inputs.ryd }}
        run: |
          cd Return-YouTube-Dislikes
          make clean package DEBUG=0 FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless
          mv packages/*.deb ${{ github.workspace }}/ryd.deb

      - name: Build YouGroupSettings
        run: |
          cd YouGroupSettings
          make clean package DEBUG=0 FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless
          mv packages/*.deb ${{ github.workspace }}/ygs.deb

      - name: Build YTVideoOverlay
        if: ${{ inputs.youpip || inputs.ytuhd || inputs.youquality }}
        run: |
          cd YTVideoOverlay
          make clean package DEBUG=0 FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless
          mv packages/*.deb ${{ github.workspace }}/ytvo.deb

      - name: Build YTABConfig
        if: ${{ inputs.abconfig }}
        run: |
          cd YTABConfig
          make clean package DEBUG=0 FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless
          mv packages/*.deb ${{ github.workspace }}/ytabconfig.deb

      - name: Build UncappedAVPlayer
        run: |
          cd UncappedAVPlayer
          make clean package DEBUG=0 FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless ARCHS=arm64
          mv packages/*.deb ${{ github.workspace }}/uncapavplayer.deb

      - name: Build DontEatMyContent
        if: ${{ inputs.demc }}
        run: |
          cd DontEatMyContent
          make clean package DEBUG=0 FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless
          mv packages/*.deb ${{ github.workspace }}/demc.deb

      - name: Build YouSlider
        if: ${{ inputs.youslider }}
        run: |
          cd YouSlider
          make clean package DEBUG=0 FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless
          mv packages/*.deb ${{ github.workspace }}/youslider.deb

      - name: Build YTweaks
        if: ${{ inputs.ytweaks }}
        run: |
          cd YTweaks
          make clean package DEBUG=0 FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless
          mv packages/*.deb ${{ github.workspace }}/ytweaks.deb
          
      - name: Build Gonerino
        if: ${{ inputs.gonerino }}
        run: |
          cd Gonerino
          make clean package DEBUG=0 FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless
          mv packages/*.deb ${{ github.workspace }}/gonerino.deb

      - name: Build youtube-native-share
        if: ${{ inputs.ytshare }}
        run: |
          cd youtube-native-share
          git clone --quiet --depth=1 https://github.com/protocolbuffers/protobuf.git
          make clean package DEBUG=0 FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless ARCHS=arm64
          mv packages/*.deb ${{ github.workspace }}/ytnativeshare.deb

      - name: Build VolumeBoostYT
        if: ${{ inputs.volboost }}
        run: |
          cd VolumeBoostYT
          make clean package DEBUG=0 FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless ARCHS=arm64
          mv packages/*.deb ${{ github.workspace }}/volboostyt.deb

      - name: Build YouQuality
        if: ${{ inputs.youquality }}
        run: |
          cd YouQuality
          make clean package DEBUG=0 FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless
          mv packages/*.deb ${{ github.workspace }}/youquality.deb
          
      - name: Inject Tweaks Into IPA
        run: |
          tweaks="OpenYouTubeSafariExtension.appex"

          for f in *.deb; do
            tweaks="$tweaks $f"
          done
          
          cyan -i youtube.ipa -o stage.ipa -uwef $tweaks -n "${{ inputs.display_name }}" -b ${{ inputs.bundle_id }}

      # Les load commands injectées par cyan (une par dylib) peuvent dépasser le padding de
      # l'en-tête Mach-O de YouTube (code à 0x4000) et écraser son code -> SIGILL au lancement.
      # On mesure la marge ; si elle est négative, on remplace toutes les dylibs injectées par
      # une seule (TweakLoader.dylib) qui les charge au démarrage, et on restaure le code écrasé.
      - name: Check Mach-O header room (compact if needed)
        run: |
          set -euo pipefail
          OUT="YouMod_${{ env.YT_VERSION }}_v${{ env.YOUMOD_VERSION }}.ipa"
          mkdir -p .ci
          cat > .ci/machohdr.py <<'PY'
          #!/usr/bin/env python3
          """Outils Mach-O arm64 (thin) pour le workflow YouMod.

            margin  <exe>                              -> affiche la marge de l'en-tête, code 1 si négative
            compact <exe_origine> <exe_cyan> <Frameworks> <loader.dylib> <liste_sortie>
                    -> remplace les LC_LOAD_DYLIB injectés par un seul chargeur
          """
          import os
          import struct
          import sys

          HDR = 32
          LC_SEGMENT_64 = 0x19
          LC_LOAD_DYLIB = 0xC
          LC_LOAD_WEAK_DYLIB = 0x80000018
          DYLIB_CMDS = (LC_LOAD_DYLIB, LC_LOAD_WEAK_DYLIB)


          def parse(data):
              magic, _, _, _, ncmds, sizeofcmds, _, _ = struct.unpack_from('<IiiIIIII', data, 0)
              if magic != 0xFEEDFACF:
                  sys.exit("Mach-O 64 bits thin attendu (FAT ou 32 bits non gere)")
              cmds, off = [], HDR
              for _ in range(ncmds):
                  cmd, size = struct.unpack_from('<II', data, off)
                  cmds.append(bytes(data[off:off + size]))
                  off += size
              return sizeofcmds, cmds


          def first_content(cmds):
              first = None
              for c in cmds:
                  if struct.unpack_from('<I', c, 0)[0] == LC_SEGMENT_64:
                      for i in range(struct.unpack_from('<I', c, 64)[0]):
                          o = struct.unpack_from('<I', c, 72 + i * 80 + 48)[0]
                          if o:
                              first = o if first is None else min(first, o)
              return first


          def dylib_name(c):
              off = struct.unpack_from('<I', c, 8)[0]
              return c[off:].split(b'\0', 1)[0].decode()


          def build_load(name):
              raw = name.encode() + b'\0'
              size = (24 + len(raw) + 7) & ~7
              return struct.pack('<IIIIII', LC_LOAD_DYLIB, size, 24, 2, 0x10000, 0x10000) + raw.ljust(size - 24, b'\0')


          def report(path):
              sizeofcmds, cmds = parse(open(path, 'rb').read())
              first, end = first_content(cmds), HDR + sizeofcmds
              nlibs = sum(1 for c in cmds if struct.unpack_from('<I', c, 0)[0] in DYLIB_CMDS)
              print(f"  {os.path.basename(path)}: load commands jusqu'a {end:#x}, "
                    f"premier contenu a {first:#x}, marge {first - end} octets, {nlibs} dylibs liees")
              return first - end


          def compact(orig_path, new_path, frameworks, loader, list_out):
              orig = open(orig_path, 'rb').read()
              new = bytearray(open(new_path, 'rb').read())
              _, orig_cmds = parse(orig)
              sizeofcmds, new_cmds = parse(new)
              first, old_end = first_content(new_cmds), HDR + sizeofcmds

              pool, kept, removed = list(orig_cmds), [], []
              for c in new_cmds:
                  if c in pool:                       # commande d'origine : on garde
                      pool.remove(c)
                      kept.append(c)
                      continue
                  if struct.unpack_from('<I', c, 0)[0] in DYLIB_CMDS:
                      base = os.path.basename(dylib_name(c))
                      if base.endswith('.dylib') and os.path.isfile(os.path.join(frameworks, base)):
                          removed.append(base)        # dylib de tweak injectee : on la retire
                          continue
                  kept.append(c)

              if not removed:
                  sys.exit("Aucune dylib injectee a compacter")
              loader_cmd = build_load('@rpath/' + loader)
              if kept and struct.unpack_from('<I', kept[-1], 0)[0] == 0x1D:   # LC_CODE_SIGNATURE doit rester en dernier
                  kept.insert(len(kept) - 1, loader_cmd)
              else:
                  kept.append(loader_cmd)
              body = b''.join(kept)
              if HDR + len(body) > first:
                  sys.exit("Meme compactee, la liste de load commands depasse l'en-tete")

              if old_end > first:                     # restaure le code ecrase par le debordement
                  new[first:old_end] = orig[first:old_end]
              new[HDR:first] = body + bytes(first - HDR - len(body))
              struct.pack_into('<II', new, 16, len(kept), len(body))
              open(new_path, 'wb').write(new)
              open(list_out, 'w').write('\n'.join(removed) + '\n')
              print(f"  {len(removed)} dylibs retirees des load commands, 1 chargeur ajoute")


          if __name__ == '__main__':
              if len(sys.argv) == 3 and sys.argv[1] == 'margin':
                  sys.exit(0 if report(sys.argv[2]) >= 0 else 1)
              if len(sys.argv) == 7 and sys.argv[1] == 'compact':
                  compact(*sys.argv[2:])
                  sys.exit(0)
              sys.exit(__doc__)
          PY
          cat > .ci/TweakLoader.c <<'EOC'
          #include <dlfcn.h>
          #include <stdio.h>
          #include <string.h>
          #include "tweaks.h"

          __attribute__((constructor))
          static void tweakloader_init(void) {
              Dl_info info;
              if (!dladdr((const void *)&tweakloader_init, &info) || !info.dli_fname) return;
              char dir[1024];
              strlcpy(dir, info.dli_fname, sizeof dir);
              char *slash = strrchr(dir, '/');
              if (!slash) return;
              *slash = 0;
              for (int i = 0; kTweaks[i]; i++) {
                  char path[1400];
                  snprintf(path, sizeof path, "%s/%s", dir, kTweaks[i]);
                  if (!dlopen(path, RTLD_NOW | RTLD_GLOBAL))
                      fprintf(stderr, "[TweakLoader] %s: %s\n", kTweaks[i], dlerror());
              }
          }
          EOC

          ORIG=ytextracted/Payload/YouTube.app/YouTube
          rm -rf staged && unzip -q stage.ipa -d staged
          APP=staged/Payload/YouTube.app

          echo "Marge de l'en-tête Mach-O (avant puis après injection) :"
          python3 .ci/machohdr.py margin "$ORIG"
          if python3 .ci/machohdr.py margin "$APP/YouTube"; then
            echo "Marge suffisante : aucun compactage nécessaire."
          else
            echo "::warning::Les load commands débordent sur le code : compactage des dylibs injectées."
            python3 .ci/machohdr.py compact "$ORIG" "$APP/YouTube" "$APP/Frameworks" TweakLoader.dylib .ci/removed.txt
            { echo 'static const char *const kTweaks[] = {'; sed 's/.*/  "&",/' .ci/removed.txt; echo '  0 };'; } > .ci/tweaks.h
            xcrun --sdk iphoneos clang -arch arm64 -dynamiclib -O2 -miphoneos-version-min=14.0 \
              -install_name @rpath/TweakLoader.dylib -I.ci \
              -o "$APP/Frameworks/TweakLoader.dylib" .ci/TweakLoader.c
            python3 .ci/machohdr.py margin "$APP/YouTube"
          fi
          (cd staged && zip -qry "../$OUT" .)

      - name: Create a Draft Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: youmod-ipa${{ github.run_number }}
          name: YouMod_${{ env.YT_VERSION }}_v${{ env.YOUMOD_VERSION }} (${{ github.run_number }}) 
          files: YouMod_${{ env.YT_VERSION }}_v${{ env.YOUMOD_VERSION }}.ipa
          draft: true

      - name: Job Summary - Build Complete
        run: |
          echo -e '### 🛠️ Build IPA with tweaks Complete!' >> $GITHUB_STEP_SUMMARY

      - name: Job Summary - Output the Draft Release Link
        run: |
          echo -e '### 🚀 Draft Release\n\nDraft release has been created successfully! You can view your release here: https://github.com/${{ github.repository }}/releases' >> $GITHUB_STEP_SUMMARY     
          
      - name: Job Summary - Cleanup
        run: |
          echo -e '### 🧹 Cleanup\n\nYou can remove previous GitHub Actions run here: https://github.com/${{ github.repository }}/actions/workflows/delete-old-workflows-run.yml And if you want to delelte old draft releases you have then here: https://github.com/${{ github.repository }}/actions/workflows/delete-old-draft-releases.yml' >> $GITHUB_STEP_SUMMARY
